<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok conectado · EP Systems</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;text-align:center;color:#111}h1{color:#0a1630}.err{color:#c00}</style></head><body><h1 id="t">Autorización recibida</h1><p id="m">Copia este código y pégalo en el script:</p><textarea id="c" readonly style="width:100%;height:110px;font-family:monospace"></textarea><p><button onclick="navigator.clipboard.writeText(document.getElementById('c').value);this.textContent='Copiado'">Copiar código</button></p><script>
var p=new URLSearchParams(location.search);document.getElementById('c').value=p.get('code')||'';
if(p.get('error')){document.getElementById('t').textContent='No se pudo autorizar';document.getElementById('t').className='err';document.getElementById('m').textContent=(p.get('error')+' '+(p.get('error_description')||''));}
</script></body></html>
